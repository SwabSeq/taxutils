name: CI and Publish

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test native package on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out Python repository
        uses: actions/checkout@v7
        with:
          path: taxutils

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: taxutils/pyproject.toml

      - name: Install package
        working-directory: taxutils
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check imports
        working-directory: taxutils
        run: |
          python - <<'PY'
          from taxutils import backend_info, taxutils

          assert callable(taxutils)
          assert taxutils.__module__ == "taxutils.taxutils"
          assert backend_info()["selected"] == "rust"
          PY

      - name: Test package
        working-directory: taxutils
        run: python -m unittest discover -s tests -v

      - name: Compile source
        working-directory: taxutils
        run: python -m compileall src

  build-native:
    name: Build native wheel (${{ matrix.os }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out Python repository
        uses: actions/checkout@v7
        with:
          path: taxutils

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install wheel builder
        run: python -m pip install cibuildwheel==2.23.4

      - name: Enable Linux cross-architecture builds
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Build ABI3 wheels
        env:
          CIBW_BUILD: "cp310-*"
          # The manylinux/musllinux images ship no Rust toolchain at all
          # ("can't find Rust compiler"). 1.88+ is required by taxutils-core.
          CIBW_BEFORE_ALL_LINUX: >-
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.90.0
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          # macos-latest is arm64; the x86_64 wheel is cross-compiled and needs
          # the Intel std installed. 10.12 is Rust's floor for that target.
          CIBW_BEFORE_ALL_MACOS: "rustup target add x86_64-apple-darwin aarch64-apple-darwin"
          MACOSX_DEPLOYMENT_TARGET: "10.12"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_TEST_COMMAND: "python -c \"import taxutils; assert taxutils.backend_info()['selected'] == 'rust'\""
        run: python -m cibuildwheel taxutils --output-dir wheelhouse

      - name: Upload native wheels
        uses: actions/upload-artifact@v7
        with:
          name: native-wheels-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build and check source distribution
        run: |
          python -m build --sdist
          python -m twine check dist/*.tar.gz
          python -m pip wheel --no-deps --wheel-dir sdist-wheel-check dist/*.tar.gz

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-native, build-sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/taxutils
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
